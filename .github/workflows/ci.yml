name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: npm install --global pnpm@11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm contracts:generate && git diff --exit-code -- docs/api/openapi.json
      - run: pnpm check
      - run: pnpm audit --audit-level=moderate
      - run: pnpm setup:local && pnpm db:up && pnpm db:migrate && pnpm db:seed
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: docker build -f infra/docker/Dockerfile.api -t anvione-api:ci .
      - run: pnpm exec node scripts/smoke-image.mjs anvione-api:ci
      - if: always()
        run: if [ -f .env ]; then docker compose down; fi
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
